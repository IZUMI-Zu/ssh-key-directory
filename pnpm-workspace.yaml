# Pre-approve build scripts for Cloudflare and Vite dependencies that need
# them: `workerd` downloads the platform binary and `esbuild` downloads or
# builds native bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true

# Delay new releases for seven days and reject weakened package provenance.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
